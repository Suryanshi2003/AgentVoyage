services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentvoyage-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentvoyage-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend